<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Client Portal — Service Call Saver</title>
<link rel="stylesheet" href="/assets/styles/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 440px;
    margin: 4rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
    background: #f7f7f8;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  .subtitle { color: #666; font-size: 0.85rem; margin: 0 0 1.5rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; color: #333; }
  input[type="email"] {
    width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 0.9rem; margin-bottom: 0.25rem;
  }
  input[type="email"]:focus { border-color: #93b4f5; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
  .hint { font-size: 0.75rem; color: #888; margin-bottom: 1rem; }
  button {
    width: 100%; padding: 0.65rem; font-size: 0.95rem; font-weight: 600;
    background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93b4f5; cursor: not-allowed; }
  #result {
    margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 6px;
    font-size: 0.85rem; display: none;
  }
  #result.success { background: #dcfce7; border: 1px solid #86efac; color: #166534; display: block; }
  #result.error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>Client Portal</h1>
  <p class="subtitle">Enter your email to receive a login link.</p>

  <form id="loginForm">
    <label for="email">Email Address</label>
    <input type="email" id="email" required placeholder="dispatch@yourbusiness.com">
    <div class="hint">Use the email address associated with your dispatch notifications.</div>
    <button type="submit" id="submitBtn">Send Login Link</button>
  </form>

  <div id="result"></div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const resultDiv = document.getElementById('result');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    resultDiv.className = '';

    const email = document.getElementById('email').value.trim();
    if (!email) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      const res = await fetch('/portal/request-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });

      const data = await res.json();
      resultDiv.textContent = data.message || 'Check your email for a login link.';
      resultDiv.className = 'success';
    } catch (err) {
      resultDiv.textContent = 'Something went wrong. Please try again.';
      resultDiv.className = 'error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Login Link';
    }
  });
</script>
</body>
</html>
