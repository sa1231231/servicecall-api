name: CI

# Runs typecheck + unit tests on every push to main (and on PRs, if you ever
# open one). System tests, Playwright, and the Mongo-touching suites are
# intentionally excluded — they go through `npm run test:system` /
# `test:e2e` against the deployed Railway URL, not in CI.
#
# Railway's "Wait for CI" feature gates the deploy on this job's status —
# enable it under your service's Settings → Source → "Wait for CI Checks".
# Required check name: `Typecheck + Unit tests` (the `name:` field on the
# job below).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck + Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Dummy env vars so `src/config.ts`'s requireEnv() checks pass at module
    # load. Unit tests mock the modules they actually need to talk to —
    # nothing here ever reaches a live service. If config.ts gains a new
    # required var, add it here too (otherwise CI breaks at import time).
    env:
      RETELL_SIGNATURE_KEY: ci-stub-retell-sig
      RETELL_API_KEY: ci-stub-retell-key
      GHL_API_KEY: ci-stub-ghl
      API_KEY: ci-stub-api-key
      TWILIO_ACCOUNT_SID: ACci_stub_account_sid
      TWILIO_AUTH_TOKEN: ci-stub-twilio-auth
      TWILIO_PHONE_NUMBER: "+10000000000"
      RESEND_API_KEY: ci-stub-resend
      MONGODB_URL: mongodb://localhost:27017/ci-stub
      ROOT_PASSWORD: ci-stub-root-pw
      BRAVE_API_KEY: ci-stub-brave
      GOOGLE_PLACES_API_KEY: ci-stub-places

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
